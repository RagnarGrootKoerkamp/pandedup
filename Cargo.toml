[package]
name = "pandedup"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign"] }
flate2 = { version = "1.1.9", features = ["zlib-ng"] }
fxhash = "0.2.1"
gxhash = "3.5.0"
needletail = { version = "0.7.3", default-features = false, features = ["bzip2", "flate2", "zstd"] }
num_cpus = "1.17.0"
# ragc-core = "0.1.1"
# ragc-core.path = "../forks/ragc/ragc-core"
ragc-core.git = "https://github.com/ragnargrootkoerkamp/ragc"
rand = "0.10.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["chrono"] }
seq-hash = "0.2.0"
simd-minimizers = "3.0.0"
tar = "0.4.46"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zstd = "0.13.3"
# ggcat-api = { git = "https://github.com/algbio/ggcat", version = "2.2.0", default-features = false, features = ["hash-16bit", "hash-32bit", "hash-64bit", "hash-128bit", "hash-rkarp", "hash-forward"] }
ggcat-api = { git = "https://github.com/algbio/ggcat", version = "2.2.0", default-features = false, features = ["hash-64bit", "hash-128bit"] }
perfcnt = "0.8.0"


[patch.crates-io]
# seq-hash = { path = "../seq-hash" }
seq-hash.git = "https://github.com/rust-seq/seq-hash"
